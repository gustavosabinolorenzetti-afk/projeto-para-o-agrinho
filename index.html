<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto GitHub</title>
    <style>
        /* Estilos básicos inline para visualização */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bem-vindo ao meu Projeto</h1>
    </header>
    <main>
        <p>Este código único está pronto para ser hospedado no GitHub.</p>
        <button id="btnMensagem">Clique aqui</button>
    </main>

    <script>
        // Código JavaScript integrado
        document.addEventListener("DOMContentLoaded", () => {
            const botao = document.getElementById("btnMensagem");
            
            botao.addEventListener("click", () => {
                alert("Olá! O seu script unificado do GitHub funcionou com sucesso!");
            });
        });
    </script>
</body>
</html>
